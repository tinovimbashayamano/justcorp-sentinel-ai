name: Docker Build

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ml/**"
      - "alembic.ini"
      - "docker-compose.prod.yml"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create CI environment file
        run: |
          cat > .env.production <<'ENV'
          APP_ENV=production
          IMAGE_TAG=ci
          FRONTEND_PORT=8080
          POSTGRES_DB=justcorp_ci
          POSTGRES_USER=justcorp_ci
          POSTGRES_PASSWORD=ci-only-postgres-password
          DATABASE_URL=postgresql+psycopg2://justcorp_ci:ci-only-postgres-password@postgres:5432/justcorp_ci
          REDIS_PASSWORD=ci-only-redis-password
          REDIS_URL=redis://:ci-only-redis-password@redis:6379/0
          REDIS_REQUIRED=true
          JWT_SECRET_KEY=ci-only-jwt-secret-key-that-is-long-enough-for-validation
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          FRONTEND_ORIGIN=http://localhost:8080
          TRUSTED_HOSTS=localhost,127.0.0.1
          FRAUD_MODEL_PATH=/app/ml/model_artifacts/lightgbm_fraud_model.joblib
          WEB_CONCURRENCY=2
          GUNICORN_TIMEOUT=120
          RUN_MIGRATIONS=false
          VALIDATE_MODEL_ARTIFACTS=false
          ENV

      - name: Validate production Compose
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

  build-images:
    runs-on: ubuntu-latest
    needs: validate-compose
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: backend/Dockerfile.prod
            image: sentinel-backend
          - component: frontend
            context: .
            dockerfile: frontend/Dockerfile.prod
            image: sentinel-frontend

    steps:
      - uses: actions/checkout@v6

      - name: Prepare ignored model-artifact directory
        if: matrix.component == 'backend'
        run: |
          mkdir -p ml/model_artifacts
          touch ml/model_artifacts/.ci-placeholder

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: true
          sbom: true

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
