upstream justcorp_backend { server backend:8000; keepalive 32; }
server {
 listen 8080;
 server_name _;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 20m;
 gzip on;
 gzip_comp_level 6;
 gzip_min_length 1024;
 gzip_vary on;
 gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain text/xml;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "DENY" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /health { access_log off; default_type text/plain; return 200 "healthy\n"; }
 location /api/ {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Connection "";
  proxy_connect_timeout 10s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;
  proxy_pass http://justcorp_backend;
 }
 location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
 location = /index.html { expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate"; try_files $uri =404; }
 location ~ /\.(?!well-known).* { deny all; }
 location / { try_files $uri $uri/ /index.html; }
}
